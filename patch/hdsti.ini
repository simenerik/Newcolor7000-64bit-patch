[hdsti]
; ---- scanner transport (SCSI pass-through) -------------------------
; Confirmed on Windows 11 x64 with TOPAZ 2+ and TANGO via an AVA-2906.
Vendor=
SendOpcode=10
ReceiveOpcode=8
TimeoutSec=120
ChunkKB=0
Port=-1
Log=0
OpenMode=2
ZeroOutArgs=0
RetryUnitAttention=1

; ---- large file support --------------------------------------------
; Newcolor captures through libtiff 3.x, whose I/O callbacks on Windows
; pass SetFilePointer a signed 32-bit distance. Above 2 GiB that reads as
; negative and the seek fails with ERROR_NEGATIVE_SEEK, so the directory
; is never written and Newcolor reports "not enough space" with the disk
; nearly empty.
;
;   0 = off, original behaviour (2 GiB ceiling)
;   1 = log only, forwards everything unchanged, writes temphook.log
;   2 = fix: seek with a real 64-bit offset. Exact for everything below
;       4 GiB, which is the entire addressable range of a classic TIFF.
;
; Above 4 GiB nothing can help inside a classic TIFF: the header's pointer
; to the directory is 32 bits and cannot address past 2^32. Pixel data
; still lands intact - recover those scans with bigtiff_newcolor.py.
TempHook=3

; Mode 3 adds >4 GiB support on top of mode 2.
;
; libtiff 3.x holds every offset in 32 bits, so past 4 GiB the values it
; records wrap - including the one it seeks to when writing the directory.
; Left alone that lands mid-file and overwrites pixel data while reporting
; success. Mode 3 records the true 64-bit position each time SEEK_END
; produces one at or above 4 GiB, and redirects any later seek whose value
; matches a recorded one. Exact matches only; never a guess.
;
; The table is saved beside the temp file as <name>.hdsti64 so the reader
; (a different module, a different handle) can load it.
;
; Below 4 GiB mode 3 behaves identically to mode 2 - the table stays empty
; and nothing is translated.
;
; Verified against real libtiff 3.9.7: a 4.6 GB file written and read back,
; 600 sample rows checked, zero mismatches. NOT yet verified inside
; Newcolor. Set TempHook=2 to disable just this layer.

; Offset above which the corrected 64-bit seek is used, in MB.
; 0 = normal (2048 MB / 2 GiB), which is where the shipped code actually
; breaks. Below that the original path is already correct and is used
; unchanged, so ordinary scans behave bit-identically to stock Newcolor.
;
; FOR TESTING: set this to 16 and a ~20 MB scan takes the same code path a
; 3 GB one would. Seconds instead of an hour, and it exercises everything
; that usually goes wrong - hook installation, the IAT patch, the seek
; substitution, whether libtiff accepts what we return.
;
; It does NOT exercise the large-number arithmetic: on a small file the
; offsets are small. Passing at 16 MB means the plumbing is sound, not
; that 3 GB will work.
;
; SET BACK TO 0 for real scanning.
TempHookThresholdMB=0

; Offset at or above which the sidecar records a (wrapped, true) pair.
; 0 = normal (4096 MB / 4 GiB), which is where 32-bit offsets actually
; become ambiguous.
;
; FOR TESTING mode 3 on a small scan: set this to 16. Pairs get recorded,
; the sidecar is written on close, the reader loads it and looks values up.
; Below 4 GiB the wrapped value equals the true one, so the translation is
; a no-op - but the plumbing around it runs, which is the part that has
; never been tested inside Newcolor:
;   * is it CreateFileA that gets called, not CreateFileW
;   * does the reader open read-only, so the sidecar loads
;   * do writer and reader agree on the sidecar filename
; Watch temphook.log for "sidecar: wrote N pairs" then "sidecar: loaded N".
;
; SET BACK TO 0 for real scanning.
TempHookWrapAtMB=0

; Newcolor renames the temp file between writing and reading it - the writer
; produces _finescan.tmp, the reader opens TImage<id>.tmp. So the offset
; table is kept in memory and matched by file size at open, which survives
; the rename and leaves nothing on disk.
; Set to 1 to ALSO write .hdsti64 files next to each output. Debug only -
; it litters a file beside every saved TIFF.
TempHookSidecarFiles=0

; ---- BigTIFF output ------------------------------------------------
; Writes the SAVED tiff as BigTIFF instead of classic TIFF, so files above
; 4 GiB can be opened by other software. Classic TIFF stores offsets in 32
; bits and physically cannot address past 2^32.
;
; Only the saved file is affected. The temp files stay classic - libtiff 3.x
; cannot READ BigTIFF, and Newcolor reads its temp file back.
;
; 0 = off (classic TIFF, 4 GiB ceiling on the saved file)
; 1 = on  (BigTIFF; needs Photoshop CS6+, Affinity, GIMP 2.10+ or similar)
;
; Verified against libtiff 3.9.7 and tifffile with warnings as errors: a
; 4.6 GB file, 508 strips, 34 past 4 GiB, rows correct throughout.
; NOT yet verified inside Newcolor.
BigTIFFOutput=0

[types]
; 3 = Topaz2.ext -> TOPAZ 2, TOPAZ 2+, TOPAZ iX
; 4 = Topaz.ext  -> TANGO, Primescan, Nexscan F4000
;   One substring per type, matched against the INQUIRY product string.
;   Never leave a line empty - an empty pattern matches any scanner.
3=TOPAZ
4=TANGO
