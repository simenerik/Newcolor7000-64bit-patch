[hdsti]
; Optional INQUIRY vendor filter. Leave EMPTY - the TOPAZ iX reports
; vendor "HDPPKIEL" while TANGO and TOPAZ 2 report "LinoHell", so
; filtering on vendor would exclude the iX.
Vendor=

SendOpcode=10
ReceiveOpcode=8
TimeoutSec=120
ChunkKB=0
Port=-1

; 1 writes hdsti.log next to the DLL. Leave 0 normally - logging every
; command slows scans noticeably. Set to 1 before reporting a problem.
Log=0

OpenMode=2
ZeroOutArgs=0

[types]
; Newcolor asks for a scanner family by number (argument 2 of Open).
; Each number maps to ONE substring matched against the scanner's INQUIRY
; product string, so the DLL only answers for a scanner really attached.
;
;   3 = Topaz2.ext -> TOPAZ 2, TOPAZ 2+, TOPAZ iX
;   4 = Topaz.ext  -> TANGO, Primescan, Nexscan F4000
;
; Type 4 covers three scanners but matches only one substring here. With a
; Primescan or Nexscan, change TANGO to a substring of what YOUR scanner
; reports: set Log=1, start Newcolor, and read the "skipping" line in
; hdsti.log - it prints the exact product string.
;
; NEVER leave a line empty. An empty pattern matches ANY scanner, so one
; type will claim a device belonging to the other family, and Newcolor
; reports "Scanner TANGO is already used as input source".
3=TOPAZ
4=TANGO
