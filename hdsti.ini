[hdsti]
; Optional INQUIRY vendor filter. Leave EMPTY - the TOPAZ iX reports
; vendor "HDPPKIEL" while TANGO and TOPAZ 2 report "LinoHell", so
; filtering on vendor would exclude the iX.
Vendor=

SendOpcode=10
ReceiveOpcode=8
TimeoutSec=120
ChunkKB=0
Port=-1

; 1 writes hdsti.log next to the DLL. Leave 0 normally - logging every
; command slows scans noticeably. Set to 1 before reporting any problem.
Log=0

OpenMode=2
ZeroOutArgs=0

; Re-issue a command once if the scanner reports UNIT ATTENTION (it just
; reset - normal right after a firmware upload). Set 0 for the older
; behaviour of passing the failure up to Newcolor, which also worked.
RetryUnitAttention=1

[types]
; Newcolor asks for a scanner family by number (argument 2 of Open).
; Each number maps to a comma-separated list of substrings matched
; against the INQUIRY product string, so the DLL only answers for a
; scanner that is actually attached.
;
;   3 = Topaz2.ext -> TOPAZ 2, TOPAZ 2+, TOPAZ iX
;   4 = Topaz.ext  -> TANGO, Primescan, Nexscan F4000
;
; NEVER leave a line empty. An empty pattern matches ANY scanner, so the
; type would claim a device belonging to the other family - which makes
; Newcolor report "Scanner TANGO is already used as input source".
;
; Only TOPAZ and TANGO are confirmed against real hardware. The Primescan
; and Nexscan entries are educated guesses at their product strings. If
; one is not found, set Log=1 and look for the "skipping" line - it prints
; the exact string the scanner reported. Put that here.
3=TOPAZ
4=TANGO,PRIMESCAN,PRIME,NEXSCAN,NEX
