[hdsti]
; Optional INQUIRY vendor filter. Leave EMPTY - the Topaz iX reports
; vendor "HDPPKIEL" while the TANGO and TOPAZ 2 report "LinoHell",
; so filtering on vendor would exclude the iX.
Vendor=

SendOpcode=10
ReceiveOpcode=8
TimeoutSec=120
ChunkKB=0
Port=-1

; 0 once everything works - logging every command slows scans badly.
Log=0

OpenMode=2
ZeroOutArgs=0

[types]
; Newcolor asks for a scanner family by number (argument 2 of Open).
; Each number maps to a substring matched against the INQUIRY product
; string, so the DLL only answers for a scanner that is actually attached.
;   3 = Topaz2.ext -> TOPAZ 2, TOPAZ 2+, TOPAZ iX
;   4 = Topaz.ext  -> TANGO
3=TOPAZ
4=TANGO
